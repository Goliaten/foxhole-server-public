[project]
name = "fastapi_server"
version = "0.1.0"
description = "template server"
authors = [{name = "Goliaten"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.1",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.38.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pip>=26.0.1",
    "pytest>=9.0.2",
    "ruff>=0.14.2",
]
