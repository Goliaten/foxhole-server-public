services:

  core:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12.3
        
        COPY ./pyproject.toml /usr/pyproject.toml

        WORKDIR /usr

        RUN python -m pip install uv

        RUN pip install uv
        RUN uv pip install --system .
    container_name: fastapi_server
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
    command: >
      uvicorn src.main:app 
      --host 0.0.0.0 
      --port 8001 
      --proxy-headers 
      --forwarded-allow-ips="*"
    networks:
      - app_network
    volumes:
      - ./logs:/usr/src/logs # BUG putting volume in another volume causes logs to be save to 2 different directories
      - ./src:/usr/src

  nginx:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:alpine
        RUN apk add certbot certbot-nginx
    # image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # For certificates (if using self-signed)
      - ./certbot/www:/var/www/certbot  # For Let's Encrypt challenges
      - ./certbot/conf:/etc/letsencrypt  # For Let's Encrypt certificates
      - ./nginx/logs:/logs
    command: [nginx-debug, '-g', 'daemon off;']
    depends_on:
      - core
    networks:
      - app_network

networks:
  app_network:
    driver: bridge